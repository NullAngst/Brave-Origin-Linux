name: Build Brave Origin

on:
  schedule:
    # Every 6 hours. Nightly and beta update every day or two, stable a few
    # times a month, and each run only builds the channels that changed.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and re-release the current version of each channel
        type: boolean
        default: false
      channels:
        description: Only these channels, space-separated (blank means all)
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'appimage/**'
      - 'channels.json'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: build-brave-origin
  cancel-in-progress: false

env:
  # Channels served as a Flatpak repo from GitHub Pages, so `flatpak update`
  # works for them. All three would be about 1.05 GB, over the 1 GB Pages
  # limit, so beta only gets bundles and AppImages.
  HOSTED_CHANNELS: stable nightly

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      release_channels: ${{ steps.resolve.outputs.release_channels }}
      versions: ${{ steps.resolve.outputs.versions }}
      upstream_tags: ${{ steps.resolve.outputs.upstream_tags }}
      any_release: ${{ steps.resolve.outputs.any_release }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
          CHANNELS_FILTER: ${{ inputs.channels || '' }}
          # A push builds every channel so script changes get tested, but
          # only new versions get released.
          BUILD_ALL: ${{ github.event_name == 'push' }}
        run: python3 scripts/resolve-release.py --github-output "$GITHUB_OUTPUT"

  flatpak:
    needs: check
    if: needs.check.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: flatpak (${{ matrix.channel }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Get Flathub's com.brave.Browser manifest
        run: git clone --depth 1 https://github.com/flathub/com.brave.Browser.git flathub-brave

      - name: Generate the manifest
        id: gen
        env:
          MATRIX: ${{ needs.check.outputs.matrix }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          manifest=$(python3 scripts/gen-flatpak-manifest.py --flathub-dir flathub-brave \
            --out-dir flatpak --channel "$CHANNEL" --matrix "$MATRIX")
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          cat "$manifest"

      - name: Build
        env:
          MANIFEST: ${{ steps.gen.outputs.manifest }}
          TARBALL: flatpak-repo-${{ matrix.channel }}-${{ matrix.arch }}.tar
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --disable-rofiles-fuse --repo=repo build "$MANIFEST"
          # Bundles and the Pages repo are made in the release job, where the
          # signing key is. Here we just hand over the build repo.
          tar -cf "$TARBALL" -C repo .

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-${{ matrix.channel }}-${{ matrix.arch }}
          path: flatpak-repo-${{ matrix.channel }}-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0

  appimage:
    needs: check
    if: needs.check.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: appimage (${{ matrix.channel }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zsync jq

      - name: Build
        env:
          CHANNEL: ${{ matrix.channel }}
          ARCH: ${{ matrix.arch }}
          URL: ${{ matrix.url }}
          SHA256: ${{ matrix.sha256 }}
          KIND: ${{ matrix.kind }}
          VERSION: ${{ matrix.version }}
        run: |
          OUT_DIR=dist bash scripts/build-appimage.sh \
            "$CHANNEL" "$ARCH" "$URL" "$SHA256" "$KIND" "$VERSION" "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.channel }}-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [check, flatpak, appimage]
    if: needs.check.outputs.any_release == 'true'
    runs-on: ubuntu-24.04
    outputs:
      deploy_pages: ${{ steps.flatpak.outputs.deploy_pages }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree jq

      # Only the channels being released. On a push, the others were built
      # just as a test and are not published.
      - uses: actions/download-artifact@v4
        with:
          pattern: appimage-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-repo-*
          path: flatpak-repos
          merge-multiple: true

      - name: Pages address
        id: pages
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          # Set the PAGES_URL repo variable if you use a custom domain.
          if [ -z "$PAGES_URL" ]; then
            PAGES_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "url=$PAGES_URL" >> "$GITHUB_OUTPUT"

      - name: Flatpak repo and bundles
        id: flatpak
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          RELEASE_CHANNELS: ${{ needs.check.outputs.release_channels }}
          VERSIONS: ${{ needs.check.outputs.versions }}
          SITE_URL: ${{ steps.pages.outputs.url }}
        run: |
          if [ -n "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            export GPG_HOMEDIR="$RUNNER_TEMP/gnupg"
            mkdir -m 700 "$GPG_HOMEDIR"
            printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --homedir "$GPG_HOMEDIR" --batch --import
            GPG_KEY_ID=$(gpg --homedir "$GPG_HOMEDIR" --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
            export GPG_KEY_ID
          else
            echo "::warning::FLATPAK_GPG_PRIVATE_KEY is not set, so there is no hosted Flatpak repo and the bundles will not update. See the README."
          fi
          bash scripts/publish-flatpak-repo.sh flatpak-repos/*.tar

      - name: GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNELS: ${{ needs.check.outputs.release_channels }}
          VERSIONS: ${{ needs.check.outputs.versions }}
          UPSTREAM_TAGS: ${{ needs.check.outputs.upstream_tags }}
          PAGES_URL: ${{ steps.pages.outputs.url }}
          PAGES_DEPLOYED: ${{ steps.flatpak.outputs.deploy_pages }}
        run: bash scripts/publish-releases.sh

      - uses: actions/upload-pages-artifact@v3
        if: steps.flatpak.outputs.deploy_pages == 'true'
        with:
          path: site

  pages:
    needs: release
    if: needs.release.outputs.deploy_pages == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
